<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notification Center</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- Layout: Notification Center Container --- */
        .notif-wrapper {
            display: flex;
            gap: 0; 
            height: calc(100vh - 140px); 
            margin-top: 20px;
        }

        /* --- Left Side: Internal Navigation --- */
        .notif-sidebar {
            width: 240px;
            flex-shrink: 0;
            border-right: 1px solid var(--border-color); 
            padding-top: 20px;
            padding-right: 20px;
        }

        .notif-nav-item {
            padding: 12px 20px;
            margin-bottom: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 6px;
            position: relative;
            transition: all 0.2s ease;
        }

        .notif-nav-item:hover { color: var(--text-main); background-color: var(--hover-bg); }

        .notif-nav-item.active {
            color: #fff; 
            background: linear-gradient(90deg, rgba(35, 134, 54, 0.15) 0%, transparent 100%);
            border-left: 4px solid #238636;
            border-radius: 0 6px 6px 0; 
            font-weight: 700;
        }
        body:not(.dark-mode) .notif-nav-item.active { color: #238636; }

        /* --- Right Side: Content Area --- */
        .notif-content {
            flex-grow: 1;
            padding-left: 40px; 
            padding-top: 10px;
            height: 100%;
        }

        /* --- THE SINGLE CARD --- */
        .glass-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 0;
            /* Wider max-width to accommodate split view */
            max-width: 1000px; 
            height: 100%; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, rgba(35,134,54,0.3), transparent 60%);
            z-index: -1;
            border-radius: 16px;
            opacity: 0.5;
            filter: blur(10px);
        }

        /* --- SPLIT VIEW LAYOUT --- */
        .notif-split-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden; /* Container doesn't scroll, panes do */
        }

        /* Left Pane: List */
        .notif-list-pane {
            width: 350px; /* Fixed width for the list */
            flex-shrink: 0;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-card);
        }

        /* Right Pane: Detail */
        .notif-detail-pane {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px;
            background-color: var(--bg-body); /* Slight contrast for content area */
        }

        /* --- View Specifics --- */
        .card-header {
            padding: 15px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            background-color: var(--bg-card);
        }
        
        /* Controls Bar (Hidden by default) */
        .controls-bar {
            padding: 10px 24px;
            background-color: var(--hover-bg);
            border-bottom: 1px solid var(--border-color);
            display: none; 
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
            animation: fadeIn 0.2s ease-out;
        }

        /* --- Buttons --- */
        .btn-text { background: none; border: none; color: var(--accent-blue); cursor: pointer; font-weight: 600; font-size: 0.85rem; margin-left: 15px; }
        .btn-text:hover { text-decoration: underline; }
        
        .btn-danger { color: #f85149; display: none; }
        .btn-danger.visible { display: inline-block; }

        /* --- Input Fields Styling --- */
        .cyber-group { margin-bottom: 25px; }
        .cyber-label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--text-header); font-size: 0.95rem; }
        .cyber-input { width: 100%; padding: 14px 16px; background-color: var(--bg-body); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 1rem; transition: all 0.3s ease; outline: none; }
        .cyber-input:focus { border-color: #238636; box-shadow: 0 0 0 4px rgba(35, 134, 54, 0.15); }

        /* --- Send Button --- */
        .btn-neon { width: 100%; padding: 16px; border-radius: 50px; background: linear-gradient(90deg, #238636 0%, #2ea043 100%); border: none; color: white; font-size: 1rem; font-weight: 800; text-transform: uppercase; cursor: pointer; letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4); display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
        .btn-neon:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(35, 134, 54, 0.6); }
        .btn-neon svg { fill: white; width: 20px; height: 20px; }

        /* --- List View Row Styling --- */
        .notif-row {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            transition: all 0.1s;
            border-left: 3px solid transparent;
        }
        .notif-row:last-child { border-bottom: none; }
        .notif-row:hover { background-color: var(--hover-bg); }
        
        /* Active (Selected for Viewing) Row */
        .notif-row.active-view {
            background-color: rgba(35, 134, 54, 0.08); /* Light green tint */
            border-left-color: #238636; /* Green indicator bar */
        }

        /* Checkbox Wrapper */
        .checkbox-wrapper { 
            display: none; 
            align-items: center; 
            padding-top: 3px; 
        }
        .custom-checkbox { width: 16px; height: 16px; cursor: pointer; accent-color: #238636; }

        /* SELECTION MODE STYLES */
        .selection-mode .checkbox-wrapper { display: flex; animation: slideRight 0.2s ease-out; }
        .selection-mode .controls-bar { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideRight { from { opacity: 0; width: 0; margin-right: 0; } to { opacity: 1; width: 16px; margin-right: 0; } }

        .notif-details { flex-grow: 1; overflow: hidden; }
        
        .notif-header-line { display: flex; align-items: center; margin-bottom: 4px; justify-content: space-between;}
        
        /* Unread Styles */
        .unread-indicator {
            display: inline-block;
            width: 8px; height: 8px;
            background-color: #238636;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 6px #238636;
            flex-shrink: 0;
            opacity: 0; 
        }
        .notif-row.unread .unread-indicator { opacity: 1; }
        .notif-row.unread .notif-title { font-weight: 700; color: var(--text-header); }
        
        .notif-title { font-size: 0.9rem; color: var(--text-header); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;}
        .notif-snippet { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
        .notif-time { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; flex-shrink: 0;}

        /* --- Detail Pane Typography --- */
        .detail-empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--text-muted); text-align: center;
        }
        .detail-icon { width: 64px; height: 64px; fill: var(--border-color); margin-bottom: 20px; }
        
        .detail-title { font-size: 1.8rem; font-weight: 700; color: var(--text-header); margin-bottom: 10px; line-height: 1.2; }
        .detail-meta { 
            display: flex; gap: 20px; font-size: 0.9rem; color: var(--text-muted); 
            padding-bottom: 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; 
        }
        .detail-body { font-size: 1.05rem; line-height: 1.6; color: var(--text-main); white-space: pre-wrap; }

    </style>
</head>
<body>
    <script src="sidebar.js"></script>
    <main class="main-content">
        
        <div class="header">
            <h1 id="header-title">Notification Center</h1>
        </div>

        <div class="notif-wrapper">
            
            <div class="notif-sidebar">
                <div class="notif-nav-item active" id="nav-list" onclick="switchView('list')">All Notifications</div>
                <div class="notif-nav-item" id="nav-send" onclick="switchView('send')">Send Notification</div>
            </div>

            <div class="notif-content">
                
                <div id="view-list" class="glass-card" style="display: flex;">
                    <div class="card-header">
                        <h3 style="margin:0; font-size:1.1rem; color:var(--text-header);">History</h3>
                        <div>
                            <button class="btn-text" id="btnSelectMode" onclick="NotifApp.toggleSelectionMode()">Select Multiple</button>
                            <button class="btn-text" onclick="NotifApp.markAllRead()">Mark all as read</button>
                        </div>
                    </div>
                    
                    <div class="notif-split-container">
                        
                        <div class="notif-list-pane">
                            <div class="controls-bar">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <input type="checkbox" id="selectAll" class="custom-checkbox" onchange="NotifApp.toggleSelectAll(this)">
                                    <label for="selectAll" style="cursor:pointer; font-weight:500;">Select All</label>
                                </div>
                                <button id="btnDelete" class="btn-text btn-danger" onclick="NotifApp.deleteSelected()">
                                    Delete Selected (<span id="selCount">0</span>)
                                </button>
                            </div>

                            <div id="notif-list-container">
                                </div>
                        </div>

                        <div class="notif-detail-pane" id="detail-view">
                            <div class="detail-empty">
                                <svg class="detail-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                <p>Select a notification from the list to view details.</p>
                            </div>
                        </div>

                    </div>
                </div>

                <div id="view-send" class="glass-card" style="display: none;">
                     <div class="card-body-scroll" style="padding: 40px; overflow-y: auto;">
                        <form onsubmit="event.preventDefault(); NotifApp.sendBlast();" style="max-width: 600px; margin: 0 auto;">
                            <div class="cyber-group">
                                <label class="cyber-label">Target Audience</label>
                                <select class="cyber-input">
                                    <option>All Users</option>
                                    <option>Moderators Only</option>
                                    <option>Admins Only</option>
                                    <option>VIP Players</option>
                                </select>
                            </div>
                            <div class="cyber-group">
                                <label class="cyber-label">Message Title</label>
                                <input type="text" class="cyber-input" placeholder="e.g. System Maintenance" required>
                            </div>
                            <div class="cyber-group">
                                <label class="cyber-label">Message Body</label>
                                <textarea class="cyber-input" style="height: 150px; resize: vertical;" placeholder="Type your message here..." required></textarea>
                            </div>
                            <button type="submit" class="btn-neon" id="btn-submit">
                                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                                Send Blast
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        function switchView(view) {
            document.querySelectorAll('.notif-nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + view).classList.add('active');
            document.getElementById('view-send').style.display = 'none';
            document.getElementById('view-list').style.display = 'none';
            
            if(view === 'list') {
                document.getElementById('view-list').style.display = 'flex';
            } else {
                document.getElementById('view-send').style.display = 'flex';
            }
        }

        const NotifApp = {
            data: [
                { id: 1, title: "System Alert", body: "High volume detected in \"Dynamic Video\" queue. Immediate attention required for server scaling protocols.", time: "10m ago", read: false, sender: "System Monitor" },
                { id: 2, title: "New Appeal Ticket", body: "User @gamer123 has submitted an appeal ticket for review regarding their recent ban for 'Toxic Behavior'. Please review the chat logs attached to the case.", time: "45m ago", read: false, sender: "Appeal Bot" },
                { id: 3, title: "Maintenance Scheduled", body: "Scheduled maintenance for Feb 5th at 02:00 UTC. The platform will be offline for approximately 2 hours while we upgrade the database clusters.", time: "2h ago", read: true, sender: "DevOps Team" },
                { id: 4, title: "Server Load Warning", body: "Node-EU-3 is experiencing high latency (350ms). Traffic is being rerouted to Node-EU-4 automatically.", time: "3h ago", read: true, sender: "Infrastructure" },
                { id: 5, title: "Payment Gateway Error", body: "Gateway B reported a 2% failure rate increase in the last hour. Tech team is investigating.", time: "5h ago", read: false, sender: "Billing System" },
                { id: 6, title: "New Moderator Registration", body: "User @mod_candidate completed onboarding and is ready for queue assignment.", time: "1d ago", read: true, sender: "HR Portal" },
                { id: 7, title: "Policy Update: Hate Speech", body: "New moderation guidelines updated for \"Hate Speech\". Please review the wiki for the new keyword blacklist.", time: "2d ago", read: true, sender: "Policy Team" }
            ],
            selected: new Set(),
            isSelectionMode: false,
            currentViewId: null,

            init() {
                this.renderList();
            },

            renderList() {
                const container = document.getElementById('notif-list-container');
                if(this.data.length === 0) {
                    container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-muted);">No notifications found.</div>';
                    return;
                }

                container.innerHTML = this.data.map(item => `
                    <div class="notif-row ${item.read ? '' : 'unread'} ${this.currentViewId === item.id ? 'active-view' : ''}">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" class="custom-checkbox" 
                                ${this.selected.has(item.id) ? 'checked' : ''}
                                onchange="NotifApp.toggleSelect(${item.id})">
                        </div>
                        <div class="notif-details" onclick="NotifApp.handleRowClick(${item.id})">
                            <div class="notif-header-line">
                                <div style="display:flex; align-items:center;">
                                    <span class="unread-indicator"></span>
                                    <span class="notif-title">${item.title}</span>
                                </div>
                                <span class="notif-time">${item.time}</span>
                            </div>
                            <div class="notif-snippet">${item.body}</div>
                        </div>
                    </div>
                `).join('');

                this.updateControls();
            },

            renderDetail(id) {
                const container = document.getElementById('detail-view');
                const item = this.data.find(i => i.id === id);

                if (!item) {
                    container.innerHTML = `
                        <div class="detail-empty">
                             <svg class="detail-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                             <p>Select a notification from the list to view details.</p>
                        </div>`;
                    return;
                }

                container.innerHTML = `
                    <div class="detail-title">${item.title}</div>
                    <div class="detail-meta">
                        <div><strong>Sender:</strong> ${item.sender}</div>
                        <div><strong>Time:</strong> ${item.time}</div>
                        <div><strong>Status:</strong> ${item.read ? 'Read' : 'Unread'}</div>
                    </div>
                    <div class="detail-body">${item.body}</div>
                `;
            },

            toggleSelectionMode() {
                this.isSelectionMode = !this.isSelectionMode;
                const view = document.getElementById('view-list');
                const btn = document.getElementById('btnSelectMode');
                
                if (this.isSelectionMode) {
                    view.classList.add('selection-mode');
                    btn.innerText = "Cancel";
                    btn.style.color = "var(--text-muted)";
                } else {
                    view.classList.remove('selection-mode');
                    btn.innerText = "Select Multiple";
                    btn.style.color = ""; 
                    this.selected.clear();
                    document.getElementById('selectAll').checked = false;
                    this.renderList();
                }
            },

            toggleSelect(id) {
                if(this.selected.has(id)) this.selected.delete(id);
                else this.selected.add(id);
                this.updateControls();
            },

            toggleSelectAll(checkbox) {
                if(checkbox.checked) {
                    this.data.forEach(i => this.selected.add(i.id));
                } else {
                    this.selected.clear();
                }
                this.renderList();
            },

            deleteSelected() {
                if(this.selected.size === 0) return;
                if(!confirm(`Delete ${this.selected.size} notifications?`)) return;
                
                this.data = this.data.filter(i => !this.selected.has(i.id));
                
                // If currently viewed item is deleted, clear detail view
                if (this.selected.has(this.currentViewId)) {
                    this.currentViewId = null;
                    this.renderDetail(null);
                }

                this.selected.clear();
                document.getElementById('selectAll').checked = false;
                this.renderList();
            },

            markAllRead() {
                this.data.forEach(i => i.read = true);
                this.renderList();
                // If an item is currently being viewed, re-render detail to update "Status: Read"
                if (this.currentViewId) this.renderDetail(this.currentViewId);
            },
            
            handleRowClick(id) {
                if (this.isSelectionMode) {
                    // In selection mode, clicking row toggles checkbox
                    const cb = document.querySelector(`input[onchange="NotifApp.toggleSelect(${id})"]`);
                    if(cb) {
                        cb.checked = !cb.checked;
                        this.toggleSelect(id);
                    }
                } else {
                    // Normal mode: View details
                    this.currentViewId = id;
                    
                    // Mark as read locally
                    const item = this.data.find(i => i.id === id);
                    if(item && !item.read) {
                        item.read = true;
                    }
                    
                    this.renderList(); // Re-render list to show active state & read status
                    this.renderDetail(id); // Render right pane
                }
            },

            updateControls() {
                const btn = document.getElementById('btnDelete');
                const countSpan = document.getElementById('selCount');
                if(this.selected.size > 0) {
                    btn.classList.add('visible');
                    countSpan.innerText = this.selected.size;
                } else {
                    btn.classList.remove('visible');
                }
            },

            sendBlast() {
                const btn = document.getElementById('btn-submit');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = 'Sending...';
                btn.style.opacity = '0.8';
                setTimeout(() => {
                    btn.innerHTML = '✅ SENT!';
                    btn.style.background = '#238636'; 
                    setTimeout(() => {
                        alert('Notification Blast Sent Successfully!');
                        document.querySelector('form').reset();
                        btn.innerHTML = originalHTML;
                        btn.style.background = ''; 
                        btn.style.opacity = '1';
                    }, 800);
                }, 1000);
            }
        };

        NotifApp.init();
    </script>
</body>
</html>
