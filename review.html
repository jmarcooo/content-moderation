<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script src="sidebar.js"></script>

    <main class="main-content" style="padding-bottom: 100px;"> <div class="header" style="margin-bottom: 10px; border-bottom: none;">
            <div>
                <a href="moderation.html" style="text-decoration: none; color: var(--accent-blue); font-size: 0.9rem;">← Back to Queues</a>
                <h1 id="queue-title" style="margin-top: 5px;">Loading Queue...</h1>
            </div>
            <div>
                <span class="badge status-Active">Task ID: #<span id="task-id">---</span></span>
            </div>
        </div>

        <div id="loader" style="display: flex; justify-content: center; align-items: center; height: 400px; font-size: 1.2rem; color: var(--text-muted);">
            <div style="text-align: center;">
                <div>⚡ Fetching next task from AI...</div>
            </div>
        </div>

        <div id="workbench" class="workbench-container" style="display: none;">
            
            <div class="media-viewer" id="content-area">
                </div>

            <div class="metadata-panel">
                <div class="meta-group">
                    <div class="meta-label">User</div>
                    <div class="meta-value" style="display: flex; align-items: center; gap: 8px;">
                        <div class="avatar" style="width: 24px; height: 24px; font-size: 0.7rem;">U</div>
                        <span id="meta-user">@username</span>
                    </div>
                </div>

                <div class="meta-group">
                    <div class="meta-label">AI Prediction</div>
                    <div class="meta-value">
                        <span class="ai-score" id="meta-score">Toxic 94%</span>
                    </div>
                </div>

                <div class="meta-group">
                    <div class="meta-label">Account Age</div>
                    <div class="meta-value">2 days</div>
                </div>

                <div class="meta-group">
                    <div class="meta-label">Previous Violations</div>
                    <div class="meta-value">0</div>
                </div>

                <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color);">
                    <div class="meta-label">Guidelines</div>
                    <div class="meta-value" style="font-size: 0.85rem; color: var(--text-muted);">
                        Reject if content contains hate speech, harassment, or PII.
                    </div>
                </div>
            </div>

        </div>

        <div class="action-bar">
            <button class="btn-action btn-skip" onclick="nextTask()">
                Skip
                <span class="shortcut-key">[Space]</span>
            </button>
            
            <button class="btn-action btn-reject" onclick="decide('reject')">
                Reject
                <span class="shortcut-key">[R]</span>
            </button>
            
            <button class="btn-action btn-approve" onclick="decide('approve')">
                Approve
                <span class="shortcut-key">[A]</span>
            </button>
        </div>

    </main>

    <script>
        // --- 1. AUTH & SETUP ---
        if (!localStorage.getItem('currentUser')) window.location.href = 'login.html';

        // Get Queue Name from URL (e.g., review.html?queue=Comment Review)
        const urlParams = new URLSearchParams(window.location.search);
        const queueName = urlParams.get('queue') || 'General Review';
        document.getElementById('queue-title').innerText = queueName;

        // --- 2. MOCK DATA GENERATOR ---
        function generateMockTask() {
            const id = Math.floor(Math.random() * 900000) + 100000;
            const users = ['@dark_slayer', '@kitty_cat', '@troll_99', '@mark_v', '@jane_d'];
            const user = users[Math.floor(Math.random() * users.length)];
            
            let content = '';
            let score = '';

            // LOGIC: Is this a text queue or image queue?
            const isText = queueName.toLowerCase().includes('comment') || 
                           queueName.toLowerCase().includes('nick') || 
                           queueName.toLowerCase().includes('text');

            if (isText) {
                const phrases = [
                    "You are absolute trash at this game!",
                    "Follow me on IG: @spammer",
                    "Can someone help me with level 5?",
                    "I hate everyone here.",
                    "Great game, devs!"
                ];
                content = `<div class="text-viewer">${phrases[Math.floor(Math.random() * phrases.length)]}</div>`;
                score = 'Toxic ' + (Math.floor(Math.random() * 50) + 50) + '%';
            } else {
                // Placeholder Image for "Image/Video" queues
                // Using a grey placeholder box to represent image
                content = `<div style="color:#888; display:flex; flex-direction:column; align-items:center;">
                    <div style="font-size:4rem;">🖼️</div>
                    <div style="margin-top:10px;">User Uploaded Image</div>
                    <div style="font-size:0.8rem; color:#555;">(Placeholder)</div>
                </div>`;
                score = 'Nudity ' + (Math.floor(Math.random() * 50) + 50) + '%';
            }

            return { id, user, content, score };
        }

        // --- 3. FETCH & RENDER ---
        function loadNextTask() {
            // Show Loader, Hide Workbench
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('workbench').style.display = 'none';

            // Simulate Network Delay (500ms)
            setTimeout(() => {
                const task = generateMockTask();

                // Populate UI
                document.getElementById('task-id').innerText = task.id;
                document.getElementById('meta-user').innerText = task.user;
                document.getElementById('content-area').innerHTML = task.content;
                document.getElementById('meta-score').innerText = task.score;

                // Show Workbench
                document.getElementById('loader').style.display = 'none';
                document.getElementById('workbench').style.display = 'flex';
            }, 600);
        }

        // --- 4. ACTIONS ---
        function decide(action) {
            console.log(`Task decided: ${action}`);
            // Here you would normally send API request
            loadNextTask(); // Load next immediately
        }

        function nextTask() {
            loadNextTask();
        }

        // --- 5. HOTKEYS ---
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'a') decide('approve');
            if (e.key.toLowerCase() === 'r') decide('reject');
            if (e.code === 'Space') nextTask();
        });

        // Initial Load
        loadNextTask();

    </script>
</body>
</html>
