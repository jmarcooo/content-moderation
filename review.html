<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Task</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .timer-badge { font-family: monospace; font-size: 1rem; letter-spacing: 1px; font-weight: bold; }
        .restricted-text { background-color: rgba(210, 153, 34, 0.25); border-bottom: 2px solid #d29922; color: #b07b17; font-weight: bold; padding: 0 2px; border-radius: 2px; }
        
        /* Hide modules by default, JS will show them based on queue type */
        #module-content, #module-text { display: none; }
    </style>
</head>
<body>

    <script src="sidebar.js"></script>

    <main class="main-content" style="padding-bottom: 50px;">
        
        <div class="header" style="margin-bottom: 10px; border-bottom: none; padding-bottom: 0;">
            <div>
                <a href="moderation.html" style="text-decoration: none; color: var(--text-muted); font-size: 0.9rem;">← Back to Queues</a>
                <h1 id="queue-title" style="margin-top: 5px;">Loading...</h1>
            </div>
            
            <div style="display: flex; gap: 10px; align-items: center;">
                <span class="badge status-Active">Time: <span id="timer" class="timer-badge">00:00:00</span></span>
                <span class="badge" style="background-color: var(--hover-bg); border: 1px solid var(--border-color); color: var(--text-main);">
                    Done: <span id="session-counter" style="font-weight:bold;">0</span>
                </span>
            </div>
        </div>

        <div id="loader" style="display: flex; justify-content: center; align-items: center; height: 60vh; font-size: 1.2rem; color: var(--text-muted);">
            <div>⚡ Fetching next task...</div>
        </div>

        <div id="workbench" class="workbench-container" style="display: none;">
            
            <div class="left-sidebar">
                <div class="info-card">
                    <div class="info-header">Content Info</div>
                    <div class="info-row"><span class="label">Content ID:</span> <span class="value" id="content-id">--</span></div>
                    <div class="info-row"><span class="label">Type:</span> <span class="value" id="content-type">--</span></div>
                </div>
                <div class="info-card">
                    <div class="info-header">User Info</div>
                    <div class="info-row"><span class="label">User ID:</span> <span class="value" id="user-id">--</span></div>
                    <div class="info-row"><span class="label">Level:</span> <span class="value" id="user-level">--</span></div>
                    <div class="info-row"><span class="label">Violations:</span> <span class="value" id="viol-hist" style="color:#f85149">0</span></div>
                </div>
                <div class="info-card">
                    <div class="info-header">Moderation Info</div>
                    <div class="info-row"><span class="label">Task ID:</span> <span class="value" id="sidebar-task-id" style="font-family:monospace;">--</span></div>
                    <div class="info-row"><span class="label">Reviewer:</span> <span class="value" id="reviewer-name">Admin</span></div>
                </div>
            </div>

            <div class="content-canvas">
                
                <div id="module-content">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div class="section-header">CONTENT</div>
                        <span id="status-content" class="decision-badge"></span>
                    </div>
                    <div class="image-grid" id="image-container"></div>
                    
                    <div class="action-module">
                        <button class="btn-sm btn-approve-sm" onclick="setStatus('content', 'approve')">Approve</button>
                        <button class="btn-sm btn-reject-sm" onclick="openDrawer('content')">Reject</button>
                    </div>
                </div>

                <div id="module-text" style="margin-top: 30px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div class="section-header">TEXT</div>
                        <span id="status-text" class="decision-badge"></span>
                    </div>

                    <div id="text-wrapper-top" style="margin-bottom: 15px;">
                        <div class="label" id="label-top" style="margin-bottom:4px; font-weight:bold;">Context</div>
                        <div id="text-top" class="text-context-box" onmouseup="handleTextSelection('top')"></div>
                    </div>

                    <div id="text-wrapper-bottom">
                        <div class="label" id="label-bottom" style="margin-bottom:4px; font-weight:bold;">Content</div>
                        <div id="text-bottom" class="text-context-box" onmouseup="handleTextSelection('bottom')"></div>
                    </div>

                    <div class="action-module">
                        <button class="btn-sm btn-approve-sm" onclick="setStatus('text', 'approve')">Approve</button>
                        <button class="btn-sm btn-restrict-sm" onmousedown="event.preventDefault()" onclick="setStatus('text', 'restrict')">Restrict</button>
                        <button class="btn-sm btn-reject-sm" onclick="openDrawer('text')">Reject</button>
                    </div>
                </div>

                <div style="margin-top: auto; padding-top: 30px; display: flex; justify-content: flex-end; gap: 15px;">
                    <button class="btn-cancel" onclick="submitAndExit()">Submit & Exit</button>
                    <button class="btn-primary" onclick="nextTask()">Submit & Next →</button>
                </div>
            </div>
        </div>

        <div id="violationDrawer" class="violation-drawer">
            <div class="drawer-header"><span>Reason</span><span style="cursor:pointer;" onclick="closeDrawer()">✕</span></div>
            <div class="drawer-content" id="violationList"></div>
        </div>

        <div id="imageViewer" class="viewer-overlay">
            <span class="close-viewer" onclick="closeImageViewer()">×</span>
            <div class="viewer-content">
                <img id="viewer-img-target" src="" class="viewer-image" alt="Zoom View">
            </div>
            <div class="viewer-controls">
                <button class="viewer-btn" onclick="transformImage('zoomIn')" title="Zoom In">➕</button>
                <button class="viewer-btn" onclick="transformImage('zoomOut')" title="Zoom Out">➖</button>
                <button class="viewer-btn" onclick="transformImage('rotateL')" title="Rotate Left">↺</button>
                <button class="viewer-btn" onclick="transformImage('rotateR')" title="Rotate Right">↻</button>
                <button class="viewer-btn" onclick="transformImage('flip')" title="Flip Horizontal">⇄</button>
            </div>
        </div>

    </main>

    <script>
        // --- CONFIG & STATE ---
        const urlParams = new URLSearchParams(window.location.search);
        const queueName = urlParams.get('queue') || 'Review';
        const tenant = urlParams.get('tenant') || 'BP';
        document.getElementById('queue-title').innerText = `${tenant} ${queueName}`;
        
        let currentTarget = '';
        let currentScale = 1;
        let currentRotate = 0;
        let currentFlip = 1;
        
        // --- MOCK DATA GENERATOR ---
        function generateTask() {
            const id = Math.floor(Math.random() * 99999);
            const type = queueName.toLowerCase();
            
            let task = { 
                id, type, 
                userId: "720" + Math.floor(Math.random()*1000),
                images: [], 
                textTop: "", 
                textBottom: "" 
            };

            // 1. DYNAMIC REVIEW
            if (type.includes('dynamic') || type.includes('image') || type.includes('video')) {
                const imgCount = Math.floor(Math.random() * 3) + 1;
                for(let i=0; i<imgCount; i++) task.images.push(`https://picsum.photos/400/300?r=${Math.random()}`);
                task.textTop = "Check out this crazy win! #gaming #win"; 
                task.textBottom = "I can't believe I pulled this off. Follow for more clips."; 
            }
            // 2. COMMENT REVIEW
            else if (type.includes('comment')) {
                task.textTop = "Parent Post: Anyone know how to fix the lag bug?"; 
                task.textBottom = "You are trash, uninstall the game."; 
            }
            // 3. NICKNAME / PROFILE
            else if (type.includes('nick') || type.includes('profile')) {
                task.textTop = "CoolGamer123"; 
                task.textBottom = "Nazi_Killer_88"; 
            }
            // 4. AVATAR
            else if (type.includes('avatar')) {
                task.images.push(`https://i.pravatar.cc/300?u=${id}`);
            }
            return task;
        }

        // --- RENDER LOGIC ---
        function loadNextTask() {
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('workbench').style.display = 'none';
            resetUI();

            setTimeout(() => {
                const task = generateTask();
                
                document.getElementById('content-id').innerText = task.id;
                document.getElementById('content-type').innerText = queueName;
                document.getElementById('sidebar-task-id').innerText = `Task-${task.id}`;

                const q = queueName.toLowerCase();

                // MODULE 1: IMAGES
                const imgContainer = document.getElementById('image-container');
                const modContent = document.getElementById('module-content');
                
                if (q.includes('avatar')) {
                    modContent.style.display = 'block';
                    imgContainer.innerHTML = `<img src="${task.images[0]}" class="avatar-display" onclick="openImageViewer(this.src)">`;
                } else if (q.includes('dynamic') || q.includes('image')) {
                    modContent.style.display = 'block';
                    imgContainer.innerHTML = task.images.map(src => 
                        `<div class="content-image-card"><img src="${src}" onclick="openImageViewer(this.src)"></div>`
                    ).join('');
                } else {
                    modContent.style.display = 'none';
                }

                // MODULE 2: TEXT
                const modText = document.getElementById('module-text');
                const slotTop = document.getElementById('text-top');
                const slotBottom = document.getElementById('text-bottom');
                const lblTop = document.getElementById('label-top');
                const lblBottom = document.getElementById('label-bottom');

                if (q.includes('avatar')) {
                    modText.style.display = 'none'; 
                } else {
                    modText.style.display = 'block';
                    slotTop.innerText = task.textTop;
                    slotBottom.innerText = task.textBottom;

                    if (q.includes('comment')) {
                        lblTop.innerText = "Replying To (Context)";
                        slotTop.className = "text-context-box read-only"; 
                        lblBottom.innerText = "Comment to Moderate";
                        slotBottom.className = "text-context-box moderatable"; 
                    } 
                    else if (q.includes('nick') || q.includes('profile')) {
                        lblTop.innerText = "Previous (Current)";
                        slotTop.className = "text-context-box read-only";
                        lblBottom.innerText = "New Request";
                        slotBottom.className = "text-context-box moderatable";
                    }
                    else if (q.includes('dynamic')) {
                        lblTop.innerText = "Title";
                        slotTop.className = "text-context-box moderatable"; 
                        lblBottom.innerText = "Content / Caption";
                        slotBottom.className = "text-context-box moderatable"; 
                    }
                }

                document.getElementById('loader').style.display = 'none';
                document.getElementById('workbench').style.display = 'flex';
            }, 500);
        }

        // --- SUBMISSION VALIDATION (THE FIX) ---
        function validateSubmission() {
            let isValid = true;

            // 1. Check Content Module (if visible)
            const contentModule = document.getElementById('module-content');
            if (contentModule.style.display !== 'none') {
                const hasDecision = contentModule.querySelector('.btn-sm.active');
                if (!hasDecision) isValid = false;
            }

            // 2. Check Text Module (if visible)
            const textModule = document.getElementById('module-text');
            if (textModule.style.display !== 'none') {
                const hasDecision = textModule.querySelector('.btn-sm.active');
                if (!hasDecision) isValid = false;
            }

            if (!isValid) {
                alert("⚠️ Please make a decision for all visible sections before submitting.");
                return false;
            }
            return true;
        }

        function nextTask() {
            if (!validateSubmission()) return; // Stop if invalid
            
            document.getElementById('session-counter').innerText = ++tasksCompleted;
            loadNextTask();
        }

        function submitAndExit() { 
            if (!validateSubmission()) return; // Stop if invalid

            window.location.href = 'moderation.html'; 
        }

        // --- IMAGE VIEWER LOGIC ---
        function openImageViewer(src) {
            const viewer = document.getElementById('imageViewer');
            const img = document.getElementById('viewer-img-target');
            img.src = src;
            currentScale = 1; currentRotate = 0; currentFlip = 1;
            updateTransform();
            viewer.style.display = 'flex';
        }
        function closeImageViewer() { document.getElementById('imageViewer').style.display = 'none'; }
        function transformImage(action) {
            if (action === 'zoomIn') currentScale += 0.2;
            if (action === 'zoomOut') currentScale = Math.max(0.2, currentScale - 0.2);
            if (action === 'rotateR') currentRotate += 90;
            if (action === 'rotateL') currentRotate -= 90;
            if (action === 'flip') currentFlip = currentFlip * -1;
            updateTransform();
        }
        function updateTransform() {
            const img = document.getElementById('viewer-img-target');
            img.style.transform = `scale(${currentScale}, ${currentScale}) rotate(${currentRotate}deg) scaleX(${currentFlip})`;
        }

        // --- TEXT SELECTION & RESTRICT ---
        function handleTextSelection(slot) {
            const box = document.getElementById(`text-${slot}`);
            if (!box.classList.contains('moderatable')) return; // Ignore read-only

            const selection = window.getSelection();
            if (selection.rangeCount > 0 && !selection.isCollapsed && box.contains(selection.anchorNode)) {
                
                // Clean old highlights
                const highlights = box.querySelectorAll('.restricted-text');
                highlights.forEach(span => {
                    const textNode = document.createTextNode(span.textContent);
                    span.parentNode.replaceChild(textNode, span);
                });
                box.normalize();

                // Apply New Highlight
                const range = selection.getRangeAt(0);
                const span = document.createElement('span');
                span.className = 'restricted-text';
                try {
                    range.surroundContents(span);
                    selection.removeAllRanges();
                    setStatus('text', 'restrict', '', true);
                } catch (e) {}
            }
        }

        // --- RESET UI ---
        function resetUI() {
            ['content', 'text'].forEach(t => {
                const badge = document.getElementById(`status-${t}`);
                if(badge) badge.style.display = 'none';
                const container = document.getElementById(`module-${t}`);
                if(container) container.querySelectorAll('.btn-sm').forEach(b => b.classList.remove('active'));
            });
        }

        // --- STATUS & DRAWER ---
        function setStatus(target, status, reason='', preserve=false) {
            const container = document.getElementById(`module-${target}`);
            container.querySelectorAll('.btn-sm').forEach(b => b.classList.remove('active'));
            
            // Note: We don't auto-clean highlight here to allow "Restrict" button re-clicks
            // The handleTextSelection handles the highlight cleaning logic.

            if(status === 'approve') container.querySelector('.btn-approve-sm').classList.add('active');
            if(status === 'restrict') container.querySelector('.btn-restrict-sm').classList.add('active');
            if(status === 'reject') container.querySelector('.btn-reject-sm').classList.add('active');

            const badge = document.getElementById(`status-${target}`);
            badge.style.display = 'block';
            if(status === 'approve') { badge.innerText="✅ APPROVED"; badge.className="decision-badge score-perfect"; }
            else if(status === 'restrict') { badge.innerText="⚠️ RESTRICTED"; badge.className="decision-badge score-good"; }
            else { badge.innerText=`⛔ REJECTED: ${reason}`; badge.className="decision-badge score-bad"; }
        }

        let currentTargetForDrawer = '';
        const violations = { "Insults": ["Attacks", "Bullying"], "Spam": ["Ads", "Gibberish"], "NSFW": ["Nudity", "Gore"] };
        function renderViolations() {
            const list = document.getElementById('violationList');
            let h = '';
            for(let [c, s] of Object.entries(violations)) {
                h += `<div class="violation-category"><div class="category-trigger" onclick="this.nextElementSibling.classList.toggle('active')">${c} ▼</div><div class="violation-submenu">${s.map(sub=>`<div class="violation-option" onclick="confirmReject('${c}-${sub}')">${sub}</div>`).join('')}</div></div>`;
            }
            list.innerHTML = h;
        }
        function openDrawer(t) { currentTargetForDrawer = t; document.getElementById('violationDrawer').classList.add('open'); }
        function closeDrawer() { document.getElementById('violationDrawer').classList.remove('open'); }
        function confirmReject(r) { setStatus(currentTargetForDrawer, 'reject', r); closeDrawer(); }

        let tasksCompleted = 0;
        renderViolations();
        loadNextTask();

        // Timer
        let sec = 0; setInterval(() => { 
            sec++; 
            const d = new Date(sec * 1000).toISOString().substr(11, 8);
            document.getElementById('timer').innerText = d; 
        }, 1000);

    </script>
</body>
</html>
