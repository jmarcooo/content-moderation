<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Overview</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 2rem; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; }
        .card .number { font-size: 2rem; font-weight: bold; color: #ffffff; }
    </style>
</head>
<body>

    <main class="main-content">
        <h1 id="welcome-msg">Overview</h1>

        <div class="dashboard-grid">
            <div class="card">
                <h3 style="color:#8b949e">Total Users</h3>
                <div class="number">1,204</div>
                <div style="color:#238636; font-size:0.8rem">▲ 12% increase</div>
            </div>
            <div class="card">
                <h3 style="color:#8b949e">Flags Today</h3>
                <div class="number">42</div>
                <div style="color:#f85149; font-size:0.8rem">▼ High volume</div>
            </div>
        </div>
        
        <h2 style="border-bottom:1px solid #30363d; padding-bottom:10px; color:white; font-size:1.1rem">Recent Activity</h2>
        <ul style="list-style:none; margin-top:10px;">
            <li style="padding:10px 0; border-bottom:1px solid #21262d; color:#c9d1d9;">User <strong>@spambot</strong> was banned.</li>
            <li style="padding:10px 0; border-bottom:1px solid #21262d; color:#c9d1d9;">New admin registered.</li>
        </ul>
    </main>

    <script src="sidebar.js"></script>
    <script>
        // --- AUTH GUARD ---
        // If not logged in, go back to login.html
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        if(currentUser) document.getElementById('welcome-msg').innerText = `Welcome back, ${currentUser.name}`;
    </script>
</body>
</html>
