<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Overview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-content">
        <h1 id="welcome-msg">Overview</h1>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Total Users</h3>
                <div class="number">1,204</div>
                <div class="trend up">▲ 12% from last week</div>
            </div>
            <div class="card">
                <h3>Flagged Comments</h3>
                <div class="number">42</div>
                <div class="trend down">▼ 5% from yesterday</div>
            </div>
            <div class="card">
                <h3>Pending Reviews</h3>
                <div class="number">5</div>
                <div class="trend" style="color: #d29922;">⚠ Requires attention</div>
            </div>
        </div>

        <h2 class="section-title">Recent Activity</h2>
        <ul class="activity-list">
            <li class="activity-item">
                User <strong>@spambot_99</strong> was banned.
                <span>2 mins ago</span>
            </li>
            <li class="activity-item">
                New user <strong>@dev_marco</strong> registered.
                <span>15 mins ago</span>
            </li>
            <li class="activity-item">
                System flagged 3 comments as "Toxic".
                <span>1 hour ago</span>
            </li>
        </ul>
    </main>

    <script src="sidebar.js"></script>
    <script>
        // --- AUTH GUARD ---
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        if(currentUser) document.getElementById('welcome-msg').innerText = `Welcome back, ${currentUser.name}`;
    </script>
</body>
</html>
