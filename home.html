<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Overview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-content">
        <div class="header">
            <h1 id="welcome-msg">Overview</h1>

            <div class="notification-wrapper" onclick="handleNotificationClick()" title="Notifications">
                <svg class="bell-icon" viewBox="0 0 16 16">
                    <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zm.995-14.901a1 1 0 1 0-1.99 0A5.002 5.002 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901z"/>
                </svg>
                <span id="notif-count" class="notification-badge" style="display:none;">0</span>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3 id="stat-users-title">Total Users</h3>
                <div class="number">1,204</div>
                <div class="trend up">▲ 12% from last week</div>
            </div>
            <div class="card">
                <h3 id="stat-flagged-title">Flagged Comments</h3>
                <div class="number">42</div>
                <div class="trend down">▼ 5% from yesterday</div>
            </div>
            <div class="card">
                <h3 id="stat-pending-title">Pending Reviews</h3>
                <div class="number">5</div>
                <div class="trend" style="color: #d29922;">⚠ Requires attention</div>
            </div>
        </div>

        <h2 class="section-title">Recent Activity</h2>
        <ul class="activity-list">
            <li class="activity-item">
                User <strong>@spambot_99</strong> was banned.
                <span>2 mins ago</span>
            </li>
            <li class="activity-item">
                New user <strong>@dev_marco</strong> registered.
                <span>15 mins ago</span>
            </li>
            <li class="activity-item">
                System flagged 3 comments as "Toxic".
                <span>1 hour ago</span>
            </li>
        </ul>
    </main>

    <script src="sidebar.js"></script>
    <script>
        // --- AUTH GUARD ---
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        if(currentUser) {
            // Safe append to not break translation logic
            const welcomeEl = document.getElementById('welcome-msg');
            if(welcomeEl) welcomeEl.innerText += ` - ${currentUser.name}`;
        }

        // --- NOTIFICATION LOGIC ---
        // Change this number to test the red badge
        let notificationCount = 3; 

        function updateBadge() {
            const badge = document.getElementById('notif-count');
            if (notificationCount > 0) {
                badge.style.display = 'flex'; // Show red circle
                badge.innerText = notificationCount > 99 ? '99+' : notificationCount;
            } else {
                badge.style.display = 'none'; // Hide red circle
            }
        }

        // Simulate clicking the bell (clears notifications)
        function handleNotificationClick() {
            if(notificationCount > 0) {
                // Optional: Alert or Open Modal
                // alert('You have ' + notificationCount + ' new notifications');
                
                // Clear notifications for demo purposes
                notificationCount = 0;
                updateBadge();
            }
        }

        // Initialize
        updateBadge();
    </script>
</body>
</html>
