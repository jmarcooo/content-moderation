<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderation Hub</title>
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* These styles are only for the Dashboard Overview */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }

        .card h3 { font-size: 0.9rem; color: #8b949e; margin-bottom: 10px; font-weight: normal; }
        .card .number { font-size: 2rem; font-weight: bold; color: #ffffff; }
        .card .trend { font-size: 0.8rem; margin-top: 5px; }
        .trend.up { color: #238636; }
        .trend.down { color: #f85149; }

        /* Recent Activity List */
        .section-title { font-size: 1.1rem; margin-bottom: 1rem; color: #ffffff; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }
        .activity-list { list-style: none; }
        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid #21262d;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .activity-item span { color: #8b949e; font-size: 0.8rem; }
    </style>
</head>
<body>

    <main class="main-content">
        <h1>Overview</h1>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Total Users</h3>
                <div class="number">1,204</div>
                <div class="trend up">▲ 12% from last week</div>
            </div>
            <div class="card">
                <h3>Flagged Comments</h3>
                <div class="number">42</div>
                <div class="trend down">▼ 5% from yesterday</div>
            </div>
            <div class="card">
                <h3>Pending Reviews</h3>
                <div class="number">5</div>
                <div class="trend" style="color: #e3b341;">⚠ Requires attention</div>
            </div>
        </div>

        <h2 class="section-title">Recent Activity</h2>
        <ul class="activity-list">
            <li class="activity-item">
                User <strong>@spambot_99</strong> was banned.
                <span>2 mins ago</span>
            </li>
            <li class="activity-item">
                New user <strong>@dev_marco</strong> registered.
                <span>15 mins ago</span>
            </li>
            <li class="activity-item">
                System flagged 3 comments as "Toxic".
                <span>1 hour ago</span>
            </li>
        </ul>
    </main>

    <script src="sidebar.js"></script>

    <script>
        // Check if a user is logged in
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        
        if (currentUser) {
            // Change the H1 to welcome them by name
            document.querySelector('h1').innerText = `Welcome back, ${currentUser.name}`;
        } else {
            // If they aren't logged in, send them back to login (Optional security)
            // window.location.href = 'index.html'; 
        }
    </script>

</body>
</html>
