<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: var(--bg-body); 
        }
        
        .login-card { 
            width: 100%; 
            max-width: 350px; 
            background: var(--bg-card);      
            padding: 2rem; 
            border-radius: 6px; 
            border: 1px solid var(--border-color); 
            box-shadow: var(--shadow);
            text-align: center; 
        }
        
        .sidebar { display: none; } 
    </style>
</head>
<body>

    <div class="login-card">
        <span style="font-size: 3rem;">🛡️</span>
        <h2 style="color: var(--text-header); margin: 10px 0;">Admin Portal</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Sign in to continue</p>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Username (admin)" required>
            <input type="password" id="password" placeholder="Password (password123)" required>
            <button type="submit" class="btn-primary" style="width:100%; margin-top:15px;">Sign In</button>
            <p id="error-msg" style="color:#f85149; margin-top:10px; display:none;">❌ Invalid credentials</p>
        </form>
    </div>

    <script>
        // Your Codespaces URL
        const API_URL = 'http://localhost:3000';

        // 1. CLEAR OLD SESSION
        localStorage.removeItem('currentUser'); 

        // 2. CHECK THEME
        const savedTheme = localStorage.getItem('appTheme') || 'light';
        if (savedTheme === 'dark') document.body.classList.add('dark-mode');

        // 3. LOGIN LOGIC (SERVER-SIDE)
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            try {
                // Send credentials to backend
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    window.location.href = 'home.html';
                } else {
                    document.getElementById('error-msg').innerText = "❌ " + (result.message || "Invalid credentials");
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('error-msg').innerText = "❌ Server Error. Is backend running?";
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
