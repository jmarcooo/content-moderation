<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Login specific overrides */
        body { display: flex; justify-content: center; align-items: center; }
        .login-card { width: 100%; max-width: 350px; background: #161b22; padding: 2rem; border-radius: 6px; border: 1px solid #30363d; text-align: center; }
        .sidebar { display: none; } /* Hide sidebar on login */
    </style>
</head>
<body>

    <div class="login-card">
        <span style="font-size: 3rem;">🛡️</span>
        <h2 style="color: white; margin: 10px 0;">Admin Portal</h2>
        <p style="color: #8b949e; margin-bottom: 20px;">Sign in to continue</p>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Username (admin)" required>
            <input type="password" id="password" placeholder="Password (password123)" required>
            <button type="submit" class="btn-primary" style="width:100%; margin-top:15px;">Sign In</button>
            <p id="error-msg" style="color:#f85149; margin-top:10px; display:none;">❌ Invalid credentials</p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            try {
                const res = await fetch('users.json');
                const users = await res.json();
                const valid = users.find(user => user.username === u && user.password === p);

                if (valid) {
                    localStorage.setItem('currentUser', JSON.stringify(valid));
                    window.location.href = 'home.html';
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (err) {
                alert('Error loading database. Ensure you are viewing via GitHub Pages.');
            }
        });
    </script>
</body>
</html>
