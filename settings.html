<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Layout specific for Settings Items */
        .settings-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .settings-section {
            padding-bottom: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }
        
        /* Remove border from the last item */
        .settings-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-header);
            margin-bottom: 12px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label {
            font-weight: 600;
            color: var(--text-header);
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .setting-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <script src="sidebar.js"></script>
    <main class="main-content">
        <div class="header">
            <h1 id="txt-header">Settings</h1>
        </div>
        
        <div class="settings-container">
            
            <div class="settings-section">
                <div class="section-title" id="txt-appear-title">Appearance</div>
                <div class="settings-row">
                    <div>
                        <div class="setting-label" id="txt-dark-mode">Dark Mode</div>
                        <div class="setting-desc" id="txt-dark-desc">Adjust the appearance to reduce eye strain.</div>
                    </div>
                    <button class="btn-cancel" id="btn-theme-toggle" onclick="toggleTheme()">Switch to Dark Mode</button>
                </div>
            </div>

            <div class="settings-section">
                <div class="section-title" id="txt-lang-title">Language / 语言</div>
                <div class="settings-row">
                    <div>
                        <div class="setting-label" id="txt-lang-label">Interface Language</div>
                        <div class="setting-desc" id="txt-lang-desc">Select your preferred language.</div>
                    </div>
                    <select id="langSelect" class="form-group" style="width: auto; margin-bottom: 0;" onchange="changeLanguage(this.value)">
                        <option value="en">English</option>
                        <option value="zh">中文 (Chinese)</option>
                    </select>
                </div>
            </div>

        </div>

    </main>

    <script>
        // --- 1. TRANSLATION DICTIONARY ---
        const APP_LANG_SET = localStorage.getItem('appLang') || 'en';
        
        const TEXT = {
            en: {
                header: "Settings",
                appearTitle: "Appearance",
                darkMode: "Dark Mode",
                darkDesc: "Adjust the appearance to reduce eye strain.",
                btnDark: "Switch to Dark Mode",
                btnLight: "Switch to Light Mode",
                langTitle: "Language / 语言",
                langLabel: "Interface Language",
                langDesc: "Select your preferred language."
            },
            zh: {
                header: "设置",
                appearTitle: "外观",
                darkMode: "深色模式",
                darkDesc: "调整外观以减少眼睛疲劳。",
                btnDark: "切换到深色模式",
                btnLight: "切换到浅色模式",
                langTitle: "语言 / Language",
                langLabel: "界面语言",
                langDesc: "选择您的首选语言。"
            }
        };

        const T = TEXT[APP_LANG_SET];

        // --- 2. APPLY TRANSLATIONS ---
        document.getElementById('txt-header').innerText = T.header;
        document.getElementById('txt-appear-title').innerText = T.appearTitle;
        document.getElementById('txt-dark-mode').innerText = T.darkMode;
        document.getElementById('txt-dark-desc').innerText = T.darkDesc;
        document.getElementById('txt-lang-title').innerText = T.langTitle;
        document.getElementById('txt-lang-label').innerText = T.langLabel;
        document.getElementById('txt-lang-desc').innerText = T.langDesc;

        // --- 3. THEME LOGIC ---
        // Determine button text based on current theme
        function updateThemeButtonText() {
            const isDark = document.body.classList.contains('dark-mode');
            const btn = document.getElementById('btn-theme-toggle');
            btn.innerText = isDark ? T.btnLight : T.btnDark;
        }

        // Initialize Button Text
        updateThemeButtonText();

        // Listen for theme changes (triggered from sidebar or this button)
        window.addEventListener('themeChanged', updateThemeButtonText);
        
        // Wrap the toggle to also update text immediately
        const originalToggle = window.toggleTheme;
        window.toggleTheme = function() {
            if(originalToggle) originalToggle(); // Call sidebar's toggle
            setTimeout(updateThemeButtonText, 50);
        };

        // --- 4. LANGUAGE LOGIC ---
        document.getElementById('langSelect').value = APP_LANG_SET;

        function changeLanguage(lang) {
            localStorage.setItem('appLang', lang);
            location.reload(); 
        }
    </script>
</body>
</html>
