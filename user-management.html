<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-content">
        <div class="header">
            <h1>User Management</h1>
            <button class="btn-primary" onclick="openAddModal()">+ Add User</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="addModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">Register New User</div>
            <form id="addForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="addName" required placeholder="e.g. Jon Odono">
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="addUsername" required placeholder="e.g. jodono">
                </div>

                <div class="form-group">
                    <label>Role</label>
                    <select id="addRole">
                        <option value="User">User</option>
                        <option value="Moderator">Moderator</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('addModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">Edit User</div>
            <form id="editForm">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editName" required>
                </div>

                <div class="form-group">
                    <label>Role</label>
                    <select id="editRole">
                        <option value="User">User</option>
                        <option value="Moderator">Moderator</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus">
                        <option value="Active">Active</option>
                        <option value="Banned">Banned</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('editModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="sidebar.js"></script>
    
    <script>
        let users = [];

        // --- INIT: Load Data ---
        async function init() {
            // Try to load from local memory first (so edits stick)
            const stored = localStorage.getItem('mockUsers_v2');
            
            if (stored) {
                users = JSON.parse(stored);
            } else {
                // First time? Load from file
                try {
                    const res = await fetch('users.json');
                    users = await res.json();
                    save(); // Save to memory immediately
                } catch (err) {
                    console.error("Could not load users.json");
                }
            }
            render();
        }

        // --- RENDER TABLE ---
        function render() {
            const tbody = document.getElementById('userTableBody');
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">No users found.</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td style="font-family:monospace; color:#8b949e; font-size:0.85rem;">${u.id}</td>
                    <td>
                        <strong>${u.name}</strong><br>
                        <span style="font-size:0.8em; color:#8b949e">@${u.username}</span>
                    </td>
                    <td>${u.role}</td>
                    <td><span class="badge status-${u.status}">${u.status}</span></td>
                    <td style="font-size:0.85rem; color:#8b949e;">${u.createdAt || 'N/A'}</td>
                    <td>
                        <button onclick="openEdit('${u.id}')" class="action-btn">✏️</button>
                        <button onclick="delUser('${u.id}')" class="action-btn">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        // --- EXCEL DATE ID LOGIC ---
        function getExcelDate() {
            // Excel's epoch is Dec 30, 1899
            const date = new Date();
            const excelEpoch = new Date(1899, 11, 30);
            const oneDay = 1000 * 60 * 60 * 24;
            const diff = date - excelEpoch;
            return Math.floor(diff / oneDay); // Returns e.g., 46048
        }

        function generateNewId() {
            const prefix = getExcelDate().toString(); // "46048"
            
            // Count how many IDs today start with this prefix
            const todayCount = users.filter(u => u.id.toString().startsWith(prefix)).length;
            
            // Next sequence number
            const nextSeq = todayCount + 1;
            
            // Pad with zeros to make it 9 digits long (e.g., 000000001)
            const sequence = nextSeq.toString().padStart(9, '0');
            
            return prefix + sequence; // Result: "46048000000001"
        }

        // --- ADD USER ---
        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        
        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newId = generateNewId();
            const now = new Date().toLocaleString(); // Capture "Now"

            users.push({
                id: newId,
                name: document.getElementById('addName').value,
                username: document.getElementById('addUsername').value,
                role: document.getElementById('addRole').value,
                status: 'Active',
                password: 'password123', // Default
                createdAt: now
            });
            
            save(); render(); closeModal('addModal');
            document.getElementById('addForm').reset();
        });

        // --- EDIT USER ---
        function openEdit(id) {
            // Convert to string for safe comparison
            const u = users.find(u => u.id.toString() === id.toString());
            if (!u) return;

            document.getElementById('editId').value = u.id;
            document.getElementById('editName').value = u.name;
            document.getElementById('editRole').value = u.role;
            document.getElementById('editStatus').value = u.status;
            
            document.getElementById('editModal').style.display = 'flex';
        }

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const idx = users.findIndex(u => u.id.toString() === id.toString());
            
            if (idx > -1) {
                users[idx].name = document.getElementById('editName').value;
                users[idx].role = document.getElementById('editRole').value;
                users[idx].status = document.getElementById('editStatus').value;
                save(); render(); closeModal('editModal');
            }
        });

        // --- DELETE USER ---
        function delUser(id) {
            if(confirm('Are you sure you want to delete this user?')) { 
                users = users.filter(u => u.id.toString() !== id.toString());
                save(); render(); 
            }
        }

        // --- HELPERS ---
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function save() { localStorage.setItem('mockUsers_v2', JSON.stringify(users)); }

        // Start
        init();
    </script>

</body>
</html>
