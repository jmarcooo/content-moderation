<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-content">
        <div class="header">
            <h1>User Management</h1>
            <button class="btn-primary" onclick="openAddModal()">+ Add User</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </main>

    <div id="addModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">Register New User</div>
            <form id="addForm">
                <div class="form-group"><label>Full Name</label><input type="text" id="addName" required placeholder="e.g. Jon Odono"></div>
                <div class="form-group"><label>Username</label><input type="text" id="addUsername" required placeholder="e.g. jodono"></div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="addRole"><option>User</option><option>Moderator</option><option>Admin</option></select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('addModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">Edit User</div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Full Name</label><input type="text" id="editName" required></div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="editRole"><option>User</option><option>Moderator</option><option>Admin</option></select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus"><option>Active</option><option>Banned</option></select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('editModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="sidebar.js"></script>
    <script>
        // --- AUTH GUARD ---
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'login.html';
        }

        let users = [];

        async function init() {
            const stored = localStorage.getItem('mockUsers_v2');
            if (stored) {
                users = JSON.parse(stored);
            } else {
                try {
                    const res = await fetch('users.json');
                    users = await res.json();
                    save();
                } catch (err) { console.error("Error loading users"); }
            }
            render();
        }

        function render() {
            const tbody = document.getElementById('userTableBody');
            if (users.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No users found.</td></tr>'; return; }
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td style="font-family:monospace; color:#8b949e; font-size:0.85rem;">${u.id}</td>
                    <td><strong>${u.name}</strong><br><span style="font-size:0.8em; color:#8b949e">@${u.username}</span></td>
                    <td>${u.role}</td>
                    <td><span class="badge status-${u.status}">${u.status}</span></td>
                    <td style="font-size:0.85rem;">${u.createdAt || 'N/A'}</td>
                    <td>
                        <button onclick="openEdit('${u.id}')" class="action-btn">✏️</button>
                        <button onclick="delUser('${u.id}')" class="action-btn">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function getExcelDate() {
            const date = new Date();
            const excelEpoch = new Date(1899, 11, 30);
            return Math.floor((date - excelEpoch) / (1000 * 60 * 60 * 24));
        }

        function generateNewId() {
            const prefix = getExcelDate().toString();
            const todayCount = users.filter(u => u.id.toString().startsWith(prefix)).length;
            return prefix + (todayCount + 1).toString().padStart(9, '0');
        }

        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const now = new Date().toLocaleString();
            users.push({
                id: generateNewId(),
                name: document.getElementById('addName').value,
                username: document.getElementById('addUsername').value,
                role: document.getElementById('addRole').value,
                status: 'Active',
                password: 'password123',
                createdAt: now
            });
            save(); render(); closeModal('addModal'); document.getElementById('addForm').reset();
        });

        function openEdit(id) {
            const u = users.find(u => u.id.toString() === id.toString());
            if (!u) return;
            document.getElementById('editId').value = u.id;
            document.getElementById('editName').value = u.name;
            document.getElementById('editRole').value = u.role;
            document.getElementById('editStatus').value = u.status;
            document.getElementById('editModal').style.display = 'flex';
        }

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const idx = users.findIndex(u => u.id.toString() === id.toString());
            if (idx > -1) {
                users[idx].name = document.getElementById('editName').value;
                users[idx].role = document.getElementById('editRole').value;
                users[idx].status = document.getElementById('editStatus').value;
                save(); render(); closeModal('editModal');
            }
        });

        function delUser(id) {
            if(confirm('Delete user?')) { 
                users = users.filter(u => u.id.toString() !== id.toString());
                save(); render(); 
            }
        }

        function save() { localStorage.setItem('mockUsers_v2', JSON.stringify(users)); }
        init();
    </script>
</body>
</html>
