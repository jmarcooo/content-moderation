<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderation Queues</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-content">
        <div class="header">
            <h1>Moderation Queues</h1>
            
            <div style="display: flex; align-items: center;">
                
                <select id="sortDropdown" class="sort-select" onchange="handleDropdownSort(this.value)">
                    <option value="count-desc">Pending (Highest)</option>
                    <option value="count-asc">Pending (Lowest)</option>
                    <option value="latency-desc">Latency (Slowest)</option>
                    <option value="latency-asc">Latency (Fastest)</option>
                    <option value="aht-desc">AHT (Slowest)</option>
                    <option value="aht-asc">AHT (Fastest)</option>
                </select>

                <div class="view-switcher">
                    <button id="btn-card" class="view-btn" onclick="switchView('card')" title="Card View">
                        ⊞
                    </button>
                    <button id="btn-list" class="view-btn" onclick="switchView('list')" title="List View">
                        ☰
                    </button>
                </div>

                <div style="text-align: right; margin-left: 20px;">
                    <span style="color:var(--text-muted); font-size:0.9rem;">Total Pending:</span>
                    <strong id="total-pending" style="font-size:1.2rem; color:var(--text-header); margin-left:5px;">0</strong>
                </div>
            </div>
        </div>

        <div id="queue-container" class="queue-grid">
            </div>

    </main>

    <script src="sidebar.js"></script>
    <script>
        // --- 1. AUTH GUARD ---
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'login.html';
        }

        // --- 2. CONFIGURATION ---
        let queueData = [
            { id: 'bp_img',   category: 'BP', name: 'Dynamic Image Review', count: 142, latency: '1m 20s', aht: '12s' },
            { id: 'bp_vid',   category: 'BP', name: 'Dynamic Video Review', count: 56,  latency: '3m 45s', aht: '45s' },
            { id: 'bp_com',   category: 'BP', name: 'Comment Review',       count: 890, latency: '0m 30s', aht: '5s' },
            { id: 'gp_img',   category: 'GP', name: 'Dynamic Image Review', count: 23,  latency: '5m 10s', aht: '15s' },
            { id: 'gp_com',   category: 'GP', name: 'Comment Review',       count: 45,  latency: '1m 05s', aht: '4s' },
            { id: 'gp_vid',   category: 'GP', name: 'Dynamic Video Review', count: 12,  latency: '8m 20s', aht: '55s' },
            { id: 'comm_ava', category: 'Community', name: 'Avatar Review',    count: 310, latency: '2m 15s', aht: '8s' },
            { id: 'comm_nick', category: 'Community', name: 'Nickname Review',  count: 67,  latency: '0m 50s', aht: '3s' },
            { id: 'comm_prof', category: 'Community', name: 'Profile Review',   count: 105, latency: '4m 30s', aht: '20s' }
        ];

        // --- 3. VIEW STATE & SORT LOGIC ---
        let currentView = localStorage.getItem('modQueueView') || 'card';
        let sortCol = 'count'; 
        let sortAsc = false;   // Default: Highest first (Descending)

        function switchView(viewType) {
            currentView = viewType;
            localStorage.setItem('modQueueView', viewType);
            renderQueues();
            updateViewButtons();
            
            // Show/Hide Dropdown based on view? 
            // Optional: You can hide the dropdown in List view if you prefer clicking headers.
            // For now, we keep it visible in both for consistency.
        }

        function updateViewButtons() {
            document.getElementById('btn-card').classList.toggle('active', currentView === 'card');
            document.getElementById('btn-list').classList.toggle('active', currentView === 'list');
        }

        // Helper: Convert time string to seconds
        function parseTime(timeStr) {
            if (!timeStr) return 0;
            let m = 0, s = 0;
            const mMatch = timeStr.match(/(\d+)m/);
            const sMatch = timeStr.match(/(\d+)s/);
            if (mMatch) m = parseInt(mMatch[1]);
            if (sMatch) s = parseInt(sMatch[1]);
            return (m * 60) + s;
        }

        // --- SORTING ENGINE ---
        function executeSort() {
            queueData.sort((a, b) => {
                let valA, valB;

                if (sortCol === 'latency' || sortCol === 'aht') {
                    valA = parseTime(a[sortCol]);
                    valB = parseTime(b[sortCol]);
                } else if (sortCol === 'count') {
                    valA = a[sortCol];
                    valB = b[sortCol];
                } else {
                    valA = a[sortCol].toLowerCase();
                    valB = b[sortCol].toLowerCase();
                }

                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });
            renderQueues();
        }

        // Handler for List Header Clicks
        function handleHeaderSort(column) {
            if (sortCol === column) {
                sortAsc = !sortAsc;
            } else {
                sortCol = column;
                sortAsc = true; 
            }
            // Update Dropdown to match
            syncDropdown();
            executeSort();
        }

        // Handler for Dropdown Change
        function handleDropdownSort(value) {
            const [col, dir] = value.split('-'); // e.g., "count-desc"
            sortCol = col;
            sortAsc = (dir === 'asc');
            executeSort();
        }

        // Sync dropdown to match current sort state
        function syncDropdown() {
            const dir = sortAsc ? 'asc' : 'desc';
            const val = `${sortCol}-${dir}`;
            const dropdown = document.getElementById('sortDropdown');
            // If option exists, select it
            if (dropdown.querySelector(`option[value="${val}"]`)) {
                dropdown.value = val;
            }
        }

        // Icons for List Headers
        function getSortIcon(column) {
            if (sortCol !== column) return '<span class="sort-icon">⇅</span>';
            return sortAsc ? '▲' : '▼';
        }
        function getSortClass(column) {
            return sortCol === column ? 'active-sort' : '';
        }

        // --- 4. RENDER FUNCTION ---
        function renderQueues() {
            const container = document.getElementById('queue-container');
            let total = 0;
            let html = '';

            // Update Container Class
            if (currentView === 'card') {
                container.className = 'queue-grid';
            } else {
                container.className = 'queue-container list-mode';
                html += `
                <div class="list-header-row">
                    <div class="col-tenant ${getSortClass('category')}" onclick="handleHeaderSort('category')">
                        TENANT ${getSortIcon('category')}
                    </div>
                    <div class="col-name ${getSortClass('name')}" style="padding-left:20px;" onclick="handleHeaderSort('name')">
                        QUEUE NAME ${getSortIcon('name')}
                    </div>
                    <div class="col-pending ${getSortClass('count')}" onclick="handleHeaderSort('count')">
                        PENDING ${getSortIcon('count')}
                    </div>
                    <div class="col-latency ${getSortClass('latency')}" onclick="handleHeaderSort('latency')">
                        LATENCY ${getSortIcon('latency')}
                    </div>
                    <div class="col-aht ${getSortClass('aht')}" onclick="handleHeaderSort('aht')">
                        AHT ${getSortIcon('aht')}
                    </div>
                    <div class="col-action" style="cursor:default">ACTION</div>
                </div>
                `;
            }

            // Loop through data
            html += queueData.map(queue => {
                total += queue.count;

                // Priority Logic
                let priorityClass = 'priority-low';
                let listPriorityClass = 'list-priority-low';
                
                if (queue.count > 100) { priorityClass = 'priority-med'; listPriorityClass = 'list-priority-med'; }
                if (queue.count > 500) { priorityClass = 'priority-high'; listPriorityClass = 'list-priority-high'; }

                // --- RENDER BASED ON VIEW ---
                if (currentView === 'card') {
                    // IMPROVED CARD LAYOUT
                    return `
                    <div class="queue-card ${priorityClass}" onclick="openQueue('${queue.name}')">
                        <div>
                            <div class="queue-type">${queue.category}</div>
                            <div class="queue-title">${queue.name}</div>
                        </div>
                        
                        <div>
                            <div class="count-number">${queue.count.toLocaleString()}</div>
                            <div class="count-label">Pending Items</div>
                        </div>

                        <div class="card-footer">
                            <div class="card-stat-item" title="Average Latency">
                                ⏱ <span class="card-stat-val">${queue.latency}</span>
                            </div>
                            <div class="card-stat-item" title="Average Handle Time">
                                ⚡ <span class="card-stat-val">${queue.aht}</span>
                            </div>
                            <button class="btn-review" style="padding: 2px 8px; font-size: 0.75rem;">Review</button>
                        </div>
                    </div>`;
                } else {
                    // LIST LAYOUT
                    return `
                    <div class="queue-list-item ${listPriorityClass}" onclick="openQueue('${queue.name}')">
                        <div class="col-tenant"><span class="badge-tenant">${queue.category}</span></div>
                        <div class="col-name">${queue.name}</div>
                        <div class="col-pending">${queue.count.toLocaleString()} <span class="sub-text">Tasks</span></div>
                        <div class="col-latency"><span class="icon-muted">⏱</span> ${queue.latency}</div>
                        <div class="col-aht"><span class="icon-muted">⚡</span> ${queue.aht}</div>
                        <div class="col-action"><button class="btn-review">Review</button></div>
                    </div>`;
                }
            }).join('');

            container.innerHTML = html;
            document.getElementById('total-pending').innerText = total.toLocaleString();
            updateViewButtons();
        }

        function openQueue(queueName) {
            alert(`Opening queue: ${queueName}\nLoading pending items...`);
        }

        // Initialize Sorting
        executeSort();
    </script>
</body>
</html>
