<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderation Queues</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-content">
        <div class="header">
            <h1>Moderation Queues</h1>
            
            <div style="display: flex; align-items: center;">
                <div class="view-switcher">
                    <button id="btn-card" class="view-btn" onclick="switchView('card')" title="Card View">
                        ⊞
                    </button>
                    <button id="btn-list" class="view-btn" onclick="switchView('list')" title="List View">
                        ☰
                    </button>
                </div>

                <div style="text-align: right;">
                    <span style="color:var(--text-muted); font-size:0.9rem;">Total Pending:</span>
                    <strong id="total-pending" style="font-size:1.2rem; color:var(--text-header); margin-left:5px;">0</strong>
                </div>
            </div>
        </div>

        <div id="queue-container" class="queue-grid">
            </div>

    </main>

    <script src="sidebar.js"></script>
    <script>
        // --- 1. AUTH GUARD ---
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'login.html';
        }

        // --- 2. CONFIGURATION (Added Latency Data) ---
        const queueData = [
            { id: 'bp_img',   category: 'BP', name: 'Dynamic Image Review', count: 142, latency: '1m 20s' },
            { id: 'bp_vid',   category: 'BP', name: 'Dynamic Video Review', count: 56,  latency: '3m 45s' },
            { id: 'bp_com',   category: 'BP', name: 'Comment Review',       count: 890, latency: '0m 30s' },
            
            { id: 'gp_img',   category: 'GP', name: 'Dynamic Image Review', count: 23,  latency: '5m 10s' },
            { id: 'gp_com',   category: 'GP', name: 'Comment Review',       count: 45,  latency: '1m 05s' },
            { id: 'gp_vid',   category: 'GP', name: 'Dynamic Video Review', count: 12,  latency: '8m 20s' },
            
            { id: 'comm_ava', category: 'Community', name: 'Avatar Review',    count: 310, latency: '2m 15s' },
            { id: 'comm_nick', category: 'Community', name: 'Nickname Review',  count: 67,  latency: '0m 50s' },
            { id: 'comm_prof', category: 'Community', name: 'Profile Review',   count: 105, latency: '4m 30s' }
        ];

        // --- 3. VIEW STATE LOGIC ---
        let currentView = localStorage.getItem('modQueueView') || 'card';

        function switchView(viewType) {
            currentView = viewType;
            localStorage.setItem('modQueueView', viewType);
            renderQueues();
            updateViewButtons();
        }

        function updateViewButtons() {
            document.getElementById('btn-card').classList.toggle('active', currentView === 'card');
            document.getElementById('btn-list').classList.toggle('active', currentView === 'list');
        }

        // --- 4. RENDER FUNCTION ---
        function renderQueues() {
            const container = document.getElementById('queue-container');
            let total = 0;
            let html = '';

            // Update Container Class
            if (currentView === 'card') {
                container.className = 'queue-grid';
            } else {
                container.className = 'queue-container list-mode';
                // Add Header Row for List Mode
                html += `
                <div class="list-header-row">
                    <div class="col-tenant">TENANT</div>
                    <div class="col-name">QUEUE NAME</div>
                    <div class="col-pending">PENDING TASKS</div>
                    <div class="col-latency">LATENCY (AVG)</div>
                    <div class="col-action">ACTION</div>
                </div>
                `;
            }

            // Loop through data
            html += queueData.map(queue => {
                total += queue.count;

                // Priority Logic
                let priorityClass = 'priority-low';
                let listPriorityClass = 'list-priority-low';
                
                if (queue.count > 100) { 
                    priorityClass = 'priority-med'; 
                    listPriorityClass = 'list-priority-med';
                }
                if (queue.count > 500) { 
                    priorityClass = 'priority-high'; 
                    listPriorityClass = 'list-priority-high';
                }

                // --- RENDER BASED ON VIEW ---
                if (currentView === 'card') {
                    // CARD LAYOUT
                    return `
                    <div class="queue-card ${priorityClass}" onclick="openQueue('${queue.name}')">
                        <div>
                            <div class="queue-type">${queue.category}</div>
                            <div class="queue-title">${queue.name}</div>
                        </div>
                        <div class="queue-stat">
                            <div>
                                <div class="count-number">${queue.count.toLocaleString()}</div>
                                <div class="count-label">Pending Items</div>
                            </div>
                            <button class="btn-review">Review →</button>
                        </div>
                    </div>`;
                } else {
                    // LIST LAYOUT (Fixed Columns)
                    return `
                    <div class="queue-list-item ${listPriorityClass}" onclick="openQueue('${queue.name}')">
                        <div class="col-tenant"><span class="badge-tenant">${queue.category}</span></div>
                        <div class="col-name">${queue.name}</div>
                        <div class="col-pending">${queue.count.toLocaleString()} <span class="sub-text">Tasks</span></div>
                        <div class="col-latency"><span class="latency-icon">⏱</span> ${queue.latency}</div>
                        <div class="col-action"><button class="btn-review">Review</button></div>
                    </div>`;
                }
            }).join('');

            container.innerHTML = html;
            document.getElementById('total-pending').innerText = total.toLocaleString();
            updateViewButtons();
        }

        function openQueue(queueName) {
            alert(`Opening queue: ${queueName}\nLoading pending items...`);
        }

        // Initialize
        renderQueues();
    </script>
</body>
</html>
