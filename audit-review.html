<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Review Task</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .timer-badge { font-family: monospace; font-size: 1rem; letter-spacing: 1px; font-weight: bold; }
        
        /* Specific Styles for Audit Decision Box */
        .mod-decision-card {
            background-color: #f6f8fa;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-blue);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .mod-decision-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 5px; }
        .mod-decision-val { font-size: 1.1rem; font-weight: 600; color: var(--text-header); }
        .mod-decision-reason { font-size: 0.9rem; color: var(--text-main); margin-top: 4px; font-style: italic; }

        .decision-approve { border-left-color: #238636; }
        .decision-reject { border-left-color: #da3633; }
        
        .btn-agree { background-color: #238636; color: white; border: 1px solid #238636; }
        .btn-agree:hover { background-color: #1a6328; }
        
        .btn-disagree { background-color: #da3633; color: white; border: 1px solid #da3633; }
        .btn-disagree:hover { background-color: #b32b29; }

        /* SVG Styles */
        .icon-svg-lg { width: 20px; height: 20px; fill: white; }
        .close-icon-svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

    <script src="sidebar.js"></script>

    <main class="main-content" style="padding-bottom: 50px;">
        
        <div class="header" style="margin-bottom: 10px; border-bottom: none; padding-bottom: 0;">
            <div>
                <a href="audit-queue.html" style="text-decoration: none; color: var(--text-muted); font-size: 0.9rem;">← Back to Audit Queues</a>
                <h1 id="queue-title" style="margin-top: 5px;">Loading...</h1>
            </div>
            
            <div style="display: flex; gap: 10px; align-items: center;">
                <span class="badge status-Active">QA Time: <span id="timer" class="timer-badge">00:00:00</span></span>
                <span class="badge" style="background-color: var(--hover-bg); border: 1px solid var(--border-color); color: var(--text-main);">
                    Audited: <span id="session-counter" style="font-weight:bold;">0</span>
                </span>
            </div>
        </div>

        <div id="loader" style="display: flex; justify-content: center; align-items: center; height: 60vh; font-size: 1.2rem; color: var(--text-muted);">
            <div>⚡ Fetching task for audit...</div>
        </div>

        <div id="workbench" class="workbench-container" style="display: none;">
            
            <div class="left-sidebar">
                
                <div class="mod-decision-card" id="mod-decision-card">
                    <div class="mod-decision-title">Previous Decision</div>
                    <div class="mod-decision-val" id="mod-decision-val">--</div>
                    <div class="mod-decision-reason" id="mod-decision-reason"></div>
                    <div style="margin-top: 10px; font-size: 0.8rem; color: var(--text-muted);">
                        By: <span id="mod-name">--</span> <br>
                        Time: <span id="mod-time">--</span>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-header">Content Info</div>
                    <div class="info-row"><span class="label">Content ID:</span> <span class="value" id="content-id">--</span></div>
                    <div class="info-row"><span class="label">Type:</span> <span class="value" id="content-type">--</span></div>
                    <div class="info-row"><span class="label">Queue:</span> <span class="value" id="queue-name">--</span></div>
                </div>
            </div>

            <div class="content-canvas">
                
                <div id="module-content">
                    <div class="image-grid" id="image-container"></div>
                </div>

                <div id="module-text" style="margin-top: 30px;">
                    <div id="text-wrapper-top" style="margin-bottom: 15px;">
                        <div class="label" id="label-top" style="margin-bottom:4px; font-weight:bold;">Context</div>
                        <div id="text-top" class="text-context-box"></div>
                    </div>

                    <div id="text-wrapper-bottom">
                        <div class="label" id="label-bottom" style="margin-bottom:4px; font-weight:bold;">Content</div>
                        <div id="text-bottom" class="text-context-box"></div>
                    </div>
                </div>

                <div class="action-bar" style="left: 390px;"> <div style="font-weight: 600; color: var(--text-muted); margin-right: 20px;">AUDIT DECISION:</div>
                    
                    <button class="btn-sm btn-agree" style="flex: 0 0 150px; padding: 12px; font-size: 1rem;" onclick="AuditApp.submitAudit('agree')">
                        ✅ Agree (Correct)
                    </button>
                    
                    <button class="btn-sm btn-disagree" style="flex: 0 0 150px; padding: 12px; font-size: 1rem;" onclick="AuditApp.openErrorDrawer()">
                        ❌ Disagree (Error)
                    </button>
                    
                    <button class="btn-cancel" style="margin-left: auto;" onclick="AuditApp.exit()">Exit</button>
                </div>

            </div>
        </div>

        <div id="errorDrawer" class="violation-drawer">
            <div class="drawer-header">
                <span>Select Error Type</span>
                <span style="cursor:pointer;" onclick="AuditApp.closeDrawer()">
                    <svg class="close-icon-svg" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </span>
            </div>
            <div class="drawer-content" id="errorList">
                </div>
        </div>

        <div id="imageViewer" class="viewer-overlay">
            <span class="close-viewer" onclick="ImageViewer.close()">
                <svg class="close-icon-svg" style="fill: white;" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </span>
            <div class="viewer-content">
                <img id="viewer-img-target" src="" class="viewer-image" alt="Zoom View">
            </div>
        </div>

    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="audit-review-logic.js"></script>
    </body>
</html>
